[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">= 3.10"
version = "v0.1.4-test"
name = "lambast"
description = "Los Alamos Model Bias Assessment and Statistical Toolkit"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "statsmodels",
    "pandas",
    "ruptures",
    "torch",
    "h5py",
    "scikit-learn"
]
authors = [
    {name = "Natalie Elizabeth Klein", email = "neklein@lanl.gov"},
    {name = "Nidhi K Parikh", email = "nidhip@lanl.gov"},
    {name = "Samuel Thomas Wilkins Myren", email = "myrenst@lanl.gov"},
    {name = "Nishant Panda", email = "nishpan@lanl.gov"},
    {name = "Amber Joule Day", email = "aday@lanl.gov"},
]
maintainers = [
    {name = "Andrés Yagüe López", email = "ayaguelopez@lanl.gov"},
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/lanl/lambast"

# Tool configurations for line-length of 79

[tool.ruff]
line-length = 79

[tool.isort]
line_length = 79

[tool.flake8]
max-line-length = 79

[tool.autopep8]
max_line_length = 79

[tool.black]
line-length = 79

[tool.ruff.lint]
select = ["E501"]
